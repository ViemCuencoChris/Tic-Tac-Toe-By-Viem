<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe - Viem</title>
</head>
<body class="bg-[#0D1821] min-h-screen flex flex-col justify-center items-center p-8 font-[Poppins]">
  <div class="opacity-100 transition-opacity duration-[0.5s] ease-out flex flex-col justify-center items-center w-full max-w-100" id="enterPlayers">
    <h1 class="mb-8 text-4xl text-[#F0F4EF] font-bold tracking-widest text-shadow-lg"><span class="text-[#C1292E]">Tic</span><span class="text-[#BFCC94]">Tac</span> Toe</h1>

    <div class="bg-[#343434] w-full px-4 py-8 rounded-2xl flex flex-col gap-6 ring-1 ring-[#F0F4EF]">
      <div class="flex flex-col justify-center items-center gap-4">
        <label class="text-xl text-[#F0F4EF] tracking-wider" for="firstPlayerName">First Player Name</label>
        <input class="bg-[#7A7777] text-[#BFCC94] rounded-2xl outline-none border border-4 border-[#0D1821] p-2" type="text" id="firstPlayerName" name="firstPlayerName">
        <select class="appearance-base-select outline-none bg-[#0D1821] rounded-2xl ring-1 ring-[#F0F4EF] px-4 text-[#F0F4EF] cursor-pointer" name="firstPlayerSymbol" id="firstPlayerSymbol">
          <option value="X">X</option>
          <option value="O">O</option>
        </select>
      </div>
      <div class="flex flex-col justify-center items-center gap-4">
        <label class="text-xl text-[#F0F4EF] tracking-wider" for="secondPlayerName">Second Player Name</label>
        <input class="bg-[#7A7777] text-[#BFCC94] rounded-2xl outline-none border border-4 border-[#0D1821] p-2" type="text" id="secondPlayerName" name="secondPlayerName">
        <select class="appearance-base-select outline-none bg-[#0D1821] rounded-2xl ring-1 ring-[#F0F4EF] px-4 text-[#F0F4EF] cursor-pointer" name="secondPlayerSymbol" id="secondPlayerSymbol">
          <option value="O">O</option>
          <option value="X">X</option>
        </select>
      </div>
    </div>

    <button class="bg-[linear-gradient(120deg,#BFCC94_50%,#C1292E_50%)] rounded-2xl text-lg text-[#F0F4EF] font-bold p-2 mt-8 cursor-pointer" id="play">Let's Game</button>
  </div>

  <div class="hidden opacity-0 transition-opacity duration-[0.5s] ease-out grid grid-cols-3 gap-4 w-full max-w-100" id="mainGame">
    <div class="bg-[#7A7777] aspect-square w-full rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
    <div class="bg-[#7A7777] aspect-square w-full rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
    <div class="bg-[#7A7777] aspect-square w-full rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
    <div class="bg-[#7A7777] aspect-square w-full rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
    <div class="bg-[#7A7777] aspect-square w-full rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
    <div class="bg-[#7A7777] aspect-square w-full rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
    <div class="bg-[#7A7777] aspect-square w-full rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
    <div class="bg-[#7A7777] aspect-square w-full rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
    <div class="bg-[#7A7777] aspect-square w-full rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
    <button class="col-start-2 bg-[linear-gradient(120deg,#C1292E_50%,#BFCC94_50%)] rounded-2xl text-lg text-[#F0F4EF] font-bold p-2 mt-8 cursor-pointer" id="reset">Reset</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
