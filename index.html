<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe - Viem</title>
</head>
<body class="bg-[#0D1821] min-h-dvh flex flex-col justify-center items-center p-4 sm:p-8 font-[Poppins]">
  <div class="opacity-100 transition-opacity duration-[0.5s] ease-in flex flex-col justify-center items-center w-full max-w-100 2xl:max-w-150" id="enterPlayers">
    <h1 class="mb-8 text-4xl text-[#F0F4EF] font-bold tracking-widest text-shadow-lg 2xl:text-6xl"><span class="text-[#C1292E]">Tic</span><span class="text-[#BFCC94]">Tac</span> Toe</h1>

    <div class="bg-[#343434] w-full p-8 rounded-2xl flex flex-col gap-6 ring-1 ring-[#F0F4EF]">
      <div class="flex flex-col justify-center items-center gap-4">
        <label class="text-xl text-[#F0F4EF] tracking-wider 2xl:text-3xl" for="firstPlayerName">First Player Name</label>
        <input class="bg-[#7A7777] text-[#F0F4EF] rounded-2xl w-full max-w-xs outline-none border border-4 border-[#0D1821] p-2 2xl:text-2xl" type="text" id="firstPlayerName" name="firstPlayerName">
        <select class="appearance-base-select outline-none bg-[#0D1821] rounded-2xl ring-1 ring-[#F0F4EF] px-4 text-[#F0F4EF] cursor-pointer 2xl:text-xl 2xl:py-2" name="firstPlayerSymbol" id="firstPlayerSymbol">
          <option value="X">X</option>
          <option value="O">O</option>
        </select>
      </div>
      <div class="flex flex-col justify-center items-center gap-4">
        <label class="text-xl text-[#F0F4EF] tracking-wider 2xl:text-3xl" for="secondPlayerName">Second Player Name</label>
        <input class="bg-[#7A7777] text-[#F0F4EF] rounded-2xl w-full max-w-xs outline-none border border-4 border-[#0D1821] p-2 2xl:text-2xl" type="text" id="secondPlayerName" name="secondPlayerName">
        <select class="appearance-base-select outline-none bg-[#0D1821] rounded-2xl ring-1 ring-[#F0F4EF] px-4 text-[#F0F4EF] cursor-pointer 2xl:text-xl 2xl:py-2" name="secondPlayerSymbol" id="secondPlayerSymbol">
          <option value="O">O</option>
          <option value="X">X</option>
        </select>
      </div>
    </div>
    <p class="hidden text-red-400 text-center" id="errorA">Enter all fields / Avoid same symbol selection</p>

    <button class="bg-[linear-gradient(120deg,#BFCC94_50%,#C1292E_50%)] rounded-2xl text-lg text-[#F0F4EF] font-bold p-2 mt-8 cursor-pointer 2xl:text-3xl 2xl:p-5" id="play">Let's Game</button>
  </div>

  <div class="hidden opacity-0 flex flex-col justify-center items-center transition-opacity duration-[0.5s] ease-in w-full max-w-100 2xl:max-w-150" id="mainGame">
    <h1 class="mb-2 text-4xl text-[#F0F4EF] font-bold tracking-widest text-shadow-lg 2xl:text-6xl"><span class="text-[#C1292E]">Tic</span><span class="text-[#BFCC94]">Tac</span> Toe</h1>
    <p id="currentPlayer" class="mb-6 text-2xl font-bold 2xl:text-4xl"></p>
    <div class="grid grid-cols-3 gap-3 w-full max-w-80 2xl:max-w-120 2xl:gap-5">
      <div class="tile bg-[#7A7777] aspect-square rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
      <div class="tile bg-[#7A7777] aspect-square rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
      <div class="tile bg-[#7A7777] aspect-square rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
      <div class="tile bg-[#7A7777] aspect-square rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
      <div class="tile bg-[#7A7777] aspect-square rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
      <div class="tile bg-[#7A7777] aspect-square rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
      <div class="tile bg-[#7A7777] aspect-square rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
      <div class="tile bg-[#7A7777] aspect-square rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
      <div class="tile bg-[#7A7777] aspect-square rounded-2xl flex justify-center items-center font-bold text-2xl cursor-pointer"></div>
    </div>
    <button class="mt-6 bg-[linear-gradient(120deg,#C1292E_50%,#BFCC94_50%)] rounded-2xl text-lg text-[#F0F4EF] font-bold p-2 cursor-pointer 2xl:text-3xl 2xl:p-5" id="reset">Reset</button>
  </div>

  <div class="hidden opacity-0 absolute w-full max-w-70 p-8 bg-[#0b1b27] rounded-3xl border border-2 text-xl text-center text-[#F0F4EF] font-semibold transition-opacity duration-300 ease" id="winnerContainer"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
